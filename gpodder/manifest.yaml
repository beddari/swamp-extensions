manifestVersion: 1
name: "@beddari/gpodder"
version: "2026.10.27.1"
license: MIT
description: >
  A gPodder podcast library as swamp data, and a pipeline from new downloads
  to notes: transcripts, Claude's summaries and chapters, Markdown for a
  personal knowledge base, a weekly listening audit and feed health checks.

  Three model types. `@beddari/gpodder/library` reads gPodder's SQLite
  database read-only: subscriptions without their credentials, episodes with
  their files, show notes as Markdown and feed chapters; `downloads` returns
  what was downloaded since its last run, by a cursor; `listening` records
  what was played in a window; `feedHealth` fetches every feed, probes its
  newest enclosures and records incidents (dead, moved, stale, not a feed,
  no published transcripts, downloads gone or untranscribed), each error and
  warning also logged. `@beddari/gpodder/transcriber` turns an episode into
  timed segments and WebVTT with whisper.cpp on the machine or any
  OpenAI-compatible transcription endpoint. `@beddari/gpodder/enricher` has
  Claude read the show notes and transcript and return a schema-checked
  summary, topics, timestamped chapters, key points, cleaned notes and
  mentions, and exports every enriched episode as a Markdown note with front
  matter, e.g. into an Obsidian vault or a notes repository.

  Three workflows wire them: `@beddari/gpodder-ingest` (hourly, or from the
  gPodder hook in the README right after a download), `@beddari/gpodder-feed-health`
  (daily) and `@beddari/gpodder-weekly-listening` (Sundays), with a listening
  report and a feed health report. Nothing ever writes to gPodder.
repository: "https://github.com/beddari/swamp-extensions"
paths:
  base: manifest
models:
  - library.ts
  - transcriber.ts
  - enricher.ts
workflows:
